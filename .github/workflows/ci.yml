name: CI

# 触发策略：
#   - push 到 main：必须全绿，这是「可发布」的门禁
#   - PR：必须全绿才能合并
#   - 手动：排查问题时用
#
# 不在这里跑崩溃测试 —— 那个耗时长且需要 native 构建，
# 放在 crash.yml 里，只在 main 与手动触发时跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支连续推送时取消旧运行，省额度也避免「旧的失败挡住新的成功」
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 工具链门禁 + 格式检查（告警，不阻断）
  #
  # 这一 job 是**其他 job 的前置**，它同时管两件事：
  #
  # 1. **moonc 版本必须 ≥ 0.10.16**（阻断）。这是验收的硬门槛，也是代码
  #    能编译的前提：0.10.16 起 `Int` 是 64 位、`Int32` 才是 32 位，
  #    本仓库的类型标注已按新语义迁移（见 CONTRIBUTING 的版本一节）。
  #    用旧编译器编译会直接失败，所以这个检查放在最前面，报错信息比
  #    「一堆类型不匹配」有用得多。
  #
  # 2. **格式一致性**（仅告警，不阻断）。官方 CDN 只提供 latest 的二进制
  #    （实测任何带版本号的路径都是 403，见 CONTRIBUTING），所以 CI 装不了
  #    指定版本，工具链会随时间漂移。格式规则的变化不是正确性问题，
  #    让它阻断等于让「上游发版」变成「主干变红」。
  #    格式由本地 pre-commit hook 保证，CI 只做提醒。
  # ---------------------------------------------------------------------------
  fmt:
    name: 工具链与格式
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: 检查 moonc ≥ 0.10.16（阻断）
        shell: bash
        run: |
          set -euo pipefail
          # `moonc -v` 形如 v0.10.18+6c83a7f62 (2026-10-28)，取前三段数字
          V=$(moonc -v | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "moonc = $V"
          IFS=. read -r MA MI PA <<< "$V"
          ok=0
          if [ "$MA" -gt 0 ]; then ok=1
          elif [ "$MA" -eq 0 ] && [ "$MI" -gt 10 ]; then ok=1
          elif [ "$MA" -eq 0 ] && [ "$MI" -eq 10 ] && [ "$PA" -ge 16 ]; then ok=1
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::moonc $V 低于 0.10.16。本项目要求 moonc >= 0.10.16（Int 已是 64 位）。"
            echo "升级方式：moon upgrade，或从 https://www.moonbitlang.com/download 重装。"
            exit 1
          fi
          echo "moonc $V 满足 >= 0.10.16"

      - name: 对比 .moon-version
        shell: bash
        run: |
          WANT=$(tr -d ' \t\r\n' < .moon-version)
          GOT=$(moon version | head -1 | awk '{print $2}')
          echo "项目验证版本: $WANT"
          echo "CI 实际版本:  $GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::warning::CI 工具链 ($GOT) 与项目验证版本 ($WANT) 不一致。格式差异可能来自这里。"
          fi

      - name: moon fmt --check（仅告警）
        shell: bash
        run: |
          if moon fmt --check; then
            echo "格式一致。"
          else
            echo "::warning::moon fmt --check 报告了格式差异。"
            echo "本地请确认 moon version 与 .moon-version 一致，然后跑一次 moon fmt 并提交。"
          fi

  # ---------------------------------------------------------------------------
  # 类型检查与单元测试：三平台矩阵
  #
  # Windows 也跑，因为原生 IO 行为差异（路径分隔符、文件锁、
  # rename 语义）正是存储引擎最容易出平台 bug 的地方。
  # ---------------------------------------------------------------------------
  test:
    name: 检查与测试 / ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: 类型检查（警告即失败）
        run: moon check --deny-warn

      - name: 单元测试
        run: moon test

  # ---------------------------------------------------------------------------
  # 多后端构建
  #
  # 这里刻意分两种 scope，不是偷懒：
  #
  # - **lib**：只构建库包（根包），在 wasm-gc / js 上跑。这证明核心数据结构
  #   （memtable / block / varint / bloom）没有意外依赖 native 特性 ——
  #   一旦有人在库里偷偷用 extern "C" 或文件系统 API，这个 job 会立刻红。
  # - **all**：构建整个模块（库 + cmd/dbcli），只在 native 上跑。
  #   dbcli 用 `extern "C"` 调 libc 的 getchar/fflush 读 stdin，
  #   wasm-gc 与 js 后端不支持 extern "C"（编译期报 [4156]）。
  #   CLI 本来就只在 native 上有意义，没必要为它做多后端适配。
  #
  # native 只在 Linux / macOS 跑：Windows 上 native 后端需要 MSVC 工具链，
  # 配置成本高于收益，而 Windows 的 check + test 已经覆盖了语义层面。
  # ---------------------------------------------------------------------------
  build:
    name: 构建 / ${{ matrix.target }} (${{ matrix.scope }}) @ ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm-gc
            scope: lib
          - os: ubuntu-latest
            target: js
            scope: lib
          - os: ubuntu-latest
            target: native
            scope: all
          - os: macos-latest
            target: native
            scope: all
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: moon build --target ${{ matrix.target }}（scope=${{ matrix.scope }}）
        shell: bash
        run: |
          if [ "${{ matrix.scope }}" = "lib" ]; then
            # 末尾的 `.` 是包路径，只构建根包，不递归到 cmd/dbcli
            moon build --target ${{ matrix.target }} .
          else
            moon build --target ${{ matrix.target }}
          fi
