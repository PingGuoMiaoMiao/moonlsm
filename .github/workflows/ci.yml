name: CI

# 触发策略：
#   - push 到 main：必须全绿，这是「可发布」的门禁
#   - PR：必须全绿才能合并
#   - 手动：排查问题时用
#
# 不在这里跑崩溃测试 —— 那个耗时长且需要 native 构建，
# 放在 crash.yml 里，只在 main 与手动触发时跑。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支连续推送时取消旧运行，省额度也避免「旧的失败挡住新的成功」
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 格式检查（告警，不阻断）
  #
  # 为什么不用 latest 锁版本、也不阻断：
  #
  # 1. 官方 CDN 只提供 latest 的二进制。实测
  #    https://cli.moonbitlang.com/binaries/0.1.20260827/... 返回 403，
  #    任何带版本号的路径都下不到，所以「在 CI 里装指定版本」做不到。
  # 2. latest 的 moon fmt 会把 `Int` 规范化成 `Int32`，而本项目开发所用的
  #    0.1.20260827 里 `Int32` 这个类型还不存在。两边不可能同时满足。
  # 3. 格式差异不是正确性问题。让它阻断合并，等于让「工具链发布新版本」
  #    变成「主干变红」，收益为负。
  #
  # 所以：格式由本地 pre-commit hook 保证（用开发者自己的 formatter），
  # CI 只做告警。真正的类型检查与测试在 test job，那里是阻断的。
  # ---------------------------------------------------------------------------
  fmt:
    name: 格式（告警）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: 对比 .moon-version
        shell: bash
        run: |
          WANT=$(tr -d ' \t\r\n' < .moon-version)
          GOT=$(moon version | head -1 | awk '{print $2}')
          echo "项目验证版本: $WANT"
          echo "CI 实际版本:  $GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::warning::CI 工具链 ($GOT) 与项目验证版本 ($WANT) 不一致。格式与废弃警告的差异可能来自这里。"
          fi

      - name: moon fmt 后是否产生 diff
        shell: bash
        run: |
          moon fmt
          if ! git diff --exit-code --quiet; then
            echo "::warning::moon fmt 产生了 diff。这通常意味着 CI 的 formatter 比本地新。"
            echo "本地请确认 moon version 与 .moon-version 一致；若确认无误，直接提交这次格式化的结果。"
            git diff
          else
            echo "格式一致。"
          fi

  # ---------------------------------------------------------------------------
  # 类型检查与单元测试：三平台矩阵
  #
  # Windows 也跑，因为原生 IO 行为差异（路径分隔符、文件锁、
  # rename 语义）正是存储引擎最容易出平台 bug 的地方。
  # ---------------------------------------------------------------------------
  test:
    name: 检查与测试 / ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: 类型检查（警告即失败）
        run: moon check --deny-warn

      - name: 单元测试
        run: moon test

  # ---------------------------------------------------------------------------
  # 多后端构建
  #
  # 这里刻意分两种 scope，不是偷懒：
  #
  # - **lib**：只构建库包（根包），在 wasm-gc / js 上跑。这证明核心数据结构
  #   （memtable / block / varint / bloom）没有意外依赖 native 特性 ——
  #   一旦有人在库里偷偷用 extern "C" 或文件系统 API，这个 job 会立刻红。
  # - **all**：构建整个模块（库 + cmd/dbcli），只在 native 上跑。
  #   dbcli 用 `extern "C"` 调 libc 的 getchar/fflush 读 stdin，
  #   wasm-gc 与 js 后端不支持 extern "C"（编译期报 [4156]）。
  #   CLI 本来就只在 native 上有意义，没必要为它做多后端适配。
  #
  # native 只在 Linux / macOS 跑：Windows 上 native 后端需要 MSVC 工具链，
  # 配置成本高于收益，而 Windows 的 check + test 已经覆盖了语义层面。
  # ---------------------------------------------------------------------------
  build:
    name: 构建 / ${{ matrix.target }} (${{ matrix.scope }}) @ ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm-gc
            scope: lib
          - os: ubuntu-latest
            target: js
            scope: lib
          - os: ubuntu-latest
            target: native
            scope: all
          - os: macos-latest
            target: native
            scope: all
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: moon build --target ${{ matrix.target }}（scope=${{ matrix.scope }}）
        shell: bash
        run: |
          if [ "${{ matrix.scope }}" = "lib" ]; then
            # 末尾的 `.` 是包路径，只构建根包，不递归到 cmd/dbcli
            moon build --target ${{ matrix.target }} .
          else
            moon build --target ${{ matrix.target }}
          fi
