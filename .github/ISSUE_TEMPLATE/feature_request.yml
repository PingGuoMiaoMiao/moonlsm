name: 功能建议
description: 提出一个新功能或改进。注意 README 里明确列了「不做什么」，先看一眼再提。
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看两处，能省掉一轮往返：

        - [README 的「不做什么」](../blob/main/README.md) —— 事务、压缩、加密、分布式、value log 分离都在明确不做之列
        - [docs/adr/](../tree/main/docs/adr) —— 关键取舍已经记录，可能你想要的方案已经被否决过（并且写了理由）

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说问题，不要一上来就说方案。「我想要 XX API」往往不是真需求
      placeholder: |
        我需要在一次扫描里拿到超过 1000 条记录，但 scan 的 limit 上限是写死的。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
      description: 接口长什么样？会改动哪些文件？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他方案
      description: 以及为什么没选它们
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 公开 API
        - 磁盘格式（需要 bump version）
        - 崩溃一致性契约
        - 性能
        - 仅文档
        - 仅测试
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我读过 README 的「不做什么」，这个建议不在其中
          required: true
        - label: 我搜过已有 issue 和 ADR，没有重复
          required: true
